services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  service-discovery:
    build:
      context: ./microservico-discovery
      dockerfile: dockerfile
      tags: ["service-discovery"]
    ports:
      - 8761:8761
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  config-server:
    depends_on:
      service-discovery:
        condition: service_healthy
    build:
      context: ./microservico-config
      dockerfile: dockerfile
      tags: ["config-server"]
    ports:
      - 8888:8888
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  peca-service:
    depends_on:
      banco:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
    build:
      context: ./microservico-peca
      dockerfile: dockerfile
      tags: ["peca-service"]
    expose:
      - "8080"

  cliente-service:
    depends_on:
      banco:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
    build:
      context: ./microservico-cliente
      dockerfile: dockerfile
      tags: ["cliente-service"]
    expose:
      - "8080"

  representante-service:
    depends_on:
      banco:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
    build:
      context: ./microservico-representante
      dockerfile: dockerfile
      tags: ["representante-service"]
    expose:
      - "8080"

  gateway-service:
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
    build:
      context: ./microservico-gateway
      dockerfile: dockerfile
      tags: ["gateway-service"]
    ports:
      - 8080:8080

  prometheus:
    image: prom/prometheus:latest
    depends_on:
      - gateway-service
      - peca-service
      - cliente-service
      - representante-service
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - 9090:9090

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 3000:3000

volumes:
  grafana-data:
