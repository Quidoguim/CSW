global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway-service:8080"]

  - job_name: peca-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["peca-service:8080"]

  - job_name: cliente-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["cliente-service:8080"]

  - job_name: representante-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["representante-service:8080"]
